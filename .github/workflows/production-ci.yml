name: Production CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm run check:intelligence
      - run: npm run test:db
      - run: npm run test
      - run: npm run build
