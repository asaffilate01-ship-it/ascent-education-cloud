name: Production CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm run check:intelligence
      - run: npm run check:enquiry
      - run: npm run test:enquiry
      - run: npm run test:db
      - run: npm run test
      - run: npm run build

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://unipathway-browser-ci.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_ci_only
      VITE_TURNSTILE_SITE_KEY: ci-only-no-real-challenge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check public IELTS, external university intake and anonymous access in Chromium
        run: npx playwright test e2e/unipathway-ielts-admissions.spec.ts e2e/public-smoke.spec.ts

