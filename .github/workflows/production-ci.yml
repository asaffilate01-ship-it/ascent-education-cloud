name: Production CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p tsconfig.app.json
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run lint
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: npm run test:worker-operations
      - name: Native dependency retry boundaries
        run: node --test scripts/ci/retry-native-downloads.test.mjs
  database-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run test:db
      - name: Cross-centre office role, invitation and tech lab RLS rehearsal
        run: node scripts/test-unipathway-office-and-tech-db.mjs
      - name: Centre physical security, visitor idempotency and two-tenant RLS rehearsal
        run: node scripts/test-unipathway-physical-security-db.mjs
      - name: Exam session planning, reviewer independence, disabled gates and multi-centre RLS rehearsal
        run: node scripts/test-unipathway-exam-operations-db.mjs
      - name: Candidate roster F2, active enrolment, provisional seats and independent approval rehearsal
        run: node scripts/test-unipathway-exam-roster-db.mjs
      - name: Welfare privacy and 24/12-hour class release PostgreSQL rehearsal
        run: node scripts/test-unipathway-wellbeing-release-db.mjs
      - name: Fresh schema and access checks (hosted extensions deferred)
        run: npm run test:fresh-schema
  edge-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.9.6}
      - run: npm run check:intelligence
      - run: deno check --config deno.intelligence.json --node-modules-dir=auto supabase/functions/unipathway-aws-lab-gateway/index.ts supabase/functions/aws-lab-manager/index.ts
      - run: deno check --config deno.intelligence.json --node-modules-dir=auto supabase/functions/create-checkout/index.ts supabase/functions/webhook-stripe/index.ts
      - run: deno check --config deno.intelligence.json --node-modules-dir=auto supabase/functions/invite-staff/index.ts
      - run: deno check --config deno.intelligence.json --node-modules-dir=auto supabase/functions/ai-assessment-agent/index.ts supabase/functions/omniqora-assessment-advisory/index.ts supabase/functions/ai-study-assistant/index.ts
      - run: deno check --config deno.intelligence.json --node-modules-dir=auto supabase/functions/unipathway-student-read-tools/index.ts supabase/functions/ai-tutor/index.ts
      - run: npm run check:enquiry
      - run: npm run test:enquiry
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run build
  browser-acceptance:
    # Playwright 1.58.2 does not support the Ubuntu 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://unipathway-browser-ci.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_ci_only
      VITE_TURNSTILE_SITE_KEY: ci-only-no-real-challenge
      VITE_UNIPATHWAY_OFFICE_ACCESS_ENABLED: 'false'
      VITE_UNIPATHWAY_STAFF_INVITES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Browser startup diagnostics (real DOM and captured runtime errors)
        run: npx playwright test e2e/browser-startup-diagnostics.spec.ts --workers=1
      - name: Chromium acceptance for public, progression and protected routes
        run: npx playwright test e2e/unipathway-ielts-admissions.spec.ts e2e/public-smoke.spec.ts e2e/assessment-evidence.spec.ts e2e/private-feedback.spec.ts e2e/centre-feedback.spec.ts e2e/course-discovery.spec.ts e2e/qualification-accessibility.spec.ts
      - name: Connected academic journey acceptance
        run: npx playwright test e2e/ux-flow.spec.ts e2e/teaching-learning-flow.spec.ts e2e/staff-access-gates.spec.ts --workers=1
      - name: Finance and staged staff permission journeys (synthetic records only)
        env:
          VITE_UNIPATHWAY_OFFICE_ACCESS_ENABLED: 'true'
        run: npx playwright test e2e/finance-staff-flow.spec.ts --workers=1 --output=test-results/finance-staff
      - name: Retain UX flow screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unipathway-ux-flow-browser-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
