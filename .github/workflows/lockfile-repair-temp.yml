name: Repair UniPathway lockfile on feature branch (temporary)
on:
  push:
    branches:
      - audit/unipathway-roles-invited-classrooms-20261020
permissions:
  contents: write
jobs:
  synchronize-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate npm lockfile only, never run package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only lockfile drift to the same feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "chore: repair deterministic npm lockfile for production CI"
            git push origin HEAD:refs/heads/audit/unipathway-roles-invited-classrooms-20261020
          fi
