name: Native builds
on:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'ios/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android
      - run: bash android/gradlew -p android assembleDebug
      - name: Verify release signing with disposable CI credentials
        shell: bash
        run: |
          set -euo pipefail
          export UNIPATHWAY_ANDROID_KEYSTORE="$RUNNER_TEMP/ci-only.jks"
          export UNIPATHWAY_ANDROID_STORE_PASSWORD=ci-ephemeral-only
          export UNIPATHWAY_ANDROID_KEY_PASSWORD=ci-ephemeral-only
          export UNIPATHWAY_ANDROID_KEY_ALIAS=ci-only
          trap 'rm -f "$UNIPATHWAY_ANDROID_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$UNIPATHWAY_ANDROID_KEYSTORE" -storepass "$UNIPATHWAY_ANDROID_STORE_PASSWORD" -keypass "$UNIPATHWAY_ANDROID_KEY_PASSWORD" -alias ci-only -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI Test Only" -noprompt
          bash android/gradlew -p android bundleRelease
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/ci-signature.txt"
          rg -q 'jar verified' "$RUNNER_TEMP/ci-signature.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: unipathway-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync ios
      - run: xcodebuild -version
      - name: Compile unsigned simulator application
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator application
        run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ios/unipathway-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unipathway-ios-simulator
          path: ios/unipathway-simulator.zip
          retention-days: 7
