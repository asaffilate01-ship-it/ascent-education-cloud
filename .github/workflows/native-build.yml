name: Native builds
on:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'ios/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android
      - run: bash android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: unipathway-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync ios
      - run: xcodebuild -version
      - name: Compile unsigned simulator application
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator application
        run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ios/unipathway-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unipathway-ios-simulator
          path: ios/unipathway-simulator.zip
          retention-days: 7
